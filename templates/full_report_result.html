
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Full Troubleshooting Report | AutoTech</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <style>
        .report-container {
            padding: 30px;
        }

        .report-content {
            background: #0f172a;
            color: #e2e8f0;
            padding: 24px;
            border-radius: 12px;
            overflow-x: auto;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font-family: Consolas, "Courier New", monospace;
            line-height: 1.7;
        }

        .report-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 20px 0;
        }

        .action-button {
            display: inline-block;
            padding: 11px 18px;
            border-radius: 8px;
            background: #0891b2;
            color: white;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font: inherit;
        }

        .status-message {
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .status-success {
            background: #dcfce7;
            color: #166534;
        }

        .status-error {
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>

<body>
    <main class="report-container">

        <h1>Full Troubleshooting Report</h1>

        {% if success %}

            <div class="status-message status-success">
                Report generated successfully.
            </div>

            <p><strong>Saved report:</strong> {{ filename }}</p>

            <div class="report-actions">
                <a class="action-button"
                   href="{{ url_for('reports') }}">
                    View All Reports
                </a>

                <a class="action-button"
                   href="{{ url_for('dashboard') }}">
                    Back to Dashboard
                </a>
            </div>

            <h2>Report Details</h2>

            <pre class="report-content">{{ report_content }}</pre>

        {% else %}

            <div class="status-message status-error">
                The report could not be generated.
            </div>

            <p>{{ error_message }}</p>

            <a class="action-button"
               href="{{ url_for('dashboard') }}">
                Back to Dashboard
            </a>

        {% endif %}

    </main>
</body>
</html>
